# Jawafdehi Legal Archive Sources
# Source: https://jawafdehi.org
# Hugging Face Dataset: https://huggingface.co/datasets/himalaya-ai/jawafdehi_legal
#
# Jawafdehi collects legal and government records from various Nepali institutions.
# These are categorized by document type/source.

# Legal records from Attorney General's Office (charge sheets, case filings)
- id: jawafdehi_ag
  name: Attorney General's Office (Jawafdehi)
  name_ne: अटर्नी जनरलको कार्यालय
  url: https://jawafdehi.org/material/ag
  source_type: api
  category: legal_docs
  scraper_class: jawafdehi
  language: ne
  description: Charge sheets, case filings, and legal documents from Attorney General's Office
  priority: 1
  meta:
    source_type_code: ag
    doc_types:
      - charge_sheet
      - case_filing
      - legal_order

